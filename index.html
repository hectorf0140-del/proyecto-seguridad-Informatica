<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrete — Catálogo de películas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>

  <div class="filmstrip filmstrip--top" aria-hidden="true"></div>

  <header class="topbar">
    <div class="wrap topbar__inner">
      <span class="logo">CARRETE</span>
      <nav class="nav">
        <input class="search" type="text" id="searchInput" placeholder="Buscar película…">
      </nav>
      <div id="authArea" class="auth-area">
        <div id="googleBtn"></div>
        <div id="userChip" class="user-chip hidden">
          <img id="userPic" alt="">
          <span id="userName"></span>
          <button id="logoutBtn" class="logout-btn">Salir</button>
        </div>
      </div>
    </div>
  </header>

  <section class="hero">
    <div class="wrap hero__inner">
      <p class="eyebrow">Función continua</p>
      <h1>Cada carrete guarda<br>una historia distinta.</h1>
      <p class="hero__sub">Explorá el catálogo. Iniciá sesión con Google para reproducir.</p>
    </div>
  </section>

  <main class="wrap">
    <div class="section-head">
      <h2>En cartelera</h2>
    </div>
    <div id="grid" class="grid" aria-live="polite"></div>
    <p id="status" class="status"></p>
  </main>

  <!-- Modal de detalle / login -->
  <div id="modalOverlay" class="modal-overlay hidden">
    <div class="modal">
      <button id="modalClose" class="modal-close" aria-label="Cerrar">×</button>
      <div id="modalContent"></div>
    </div>
  </div>

  <div class="filmstrip filmstrip--bottom" aria-hidden="true"></div>

  <footer class="footer">
    <div class="wrap">Proyecto de demostración — datos de películas vía TMDB.</div>
  </footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
